name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pagamoz, POSTGRES_PASSWORD: pagamoz, POSTGRES_DB: pagamoz }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: apps/api } }
    env:
      DEBUG: "true"
      SECRET_KEY: ci
      DATABASE_URL: postgres://pagamoz:pagamoz@localhost:5432/pagamoz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q
      - name: OpenAPI actualizado
        run: python manage.py spectacular --file ../../packages/api-client/openapi.yaml && git diff --exit-code ../../packages/api-client/openapi.yaml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Cliente TS actualizado
        run: npm run gen:client && git diff --exit-code packages/api-client
      - run: npm run lint:web
      - run: npm run typecheck -w apps/web
      - run: npm run build:web
