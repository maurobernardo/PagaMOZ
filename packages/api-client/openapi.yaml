openapi: 3.0.3
info:
  title: PagaMOZ API
  version: 0.1.0
  description: 'Plataforma de pagamentos de serviços: protótipo de demonstração.'
paths:
  /api/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: 'Para a app móvel: devolve o token CSRF (também fica no cookie).'
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
          description: ''
  /api/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/auth/portal/login:
    post:
      operationId: auth_portal_login_create
      description: 'Passo 1: telefone + palavra-passe. Não abre sessão completa: fica
        à espera do MFA.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PortalLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PortalLoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalLoginStep'
          description: ''
  /api/auth/portal/mfa/setup:
    post:
      operationId: auth_portal_mfa_setup_create
      description: 'Primeiro acesso: gera segredo e URI otpauth para a app autenticadora.'
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
          description: ''
  /api/auth/portal/mfa/verify:
    post:
      operationId: auth_portal_mfa_verify_create
      description: 'Passo 2: código TOTP. Na primeira vez também activa o MFA.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
          description: ''
  /api/auth/portal/pending:
    get:
      operationId: auth_portal_pending_retrieve
      description: 'Depois de "Entrar com Google" no portal: falta o passo MFA.'
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalPending'
          description: ''
  /api/backoffice/audit:
    get:
      operationId: backoffice_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: prefixo, ex. payment.
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: institution
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - backoffice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditList'
          description: ''
  /api/backoffice/dead-letters:
    get:
      operationId: backoffice_dead_letters_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - backoffice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeadLetterList'
          description: ''
  /api/backoffice/dead-letters/{id}:
    post:
      operationId: backoffice_dead_letters_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DLActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DLActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DLActionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetter'
          description: ''
  /api/backoffice/discrepancies:
    get:
      operationId: backoffice_discrepancies_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - backoffice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDiscrepancyStaffList'
          description: ''
  /api/backoffice/institutions:
    get:
      operationId: backoffice_institutions_list
      tags:
      - backoffice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstitutionAdmin'
          description: ''
    post:
      operationId: backoffice_institutions_create
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InstitutionAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InstitutionAdminRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionAdmin'
          description: ''
  /api/backoffice/institutions/{slug}:
    get:
      operationId: backoffice_institutions_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - backoffice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionAdmin'
          description: ''
    patch:
      operationId: backoffice_institutions_partial_update
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInstitutionAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInstitutionAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInstitutionAdminRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionAdmin'
          description: ''
  /api/backoffice/overview:
    get:
      operationId: backoffice_overview_retrieve
      tags:
      - backoffice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
          description: ''
  /api/backoffice/parameters:
    get:
      operationId: backoffice_parameters_retrieve
      tags:
      - backoffice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parameters'
          description: ''
  /api/backoffice/providers:
    get:
      operationId: backoffice_providers_list
      tags:
      - backoffice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderHealth'
          description: ''
  /api/backoffice/reconciliation/run:
    post:
      operationId: backoffice_reconciliation_run_create
      tags:
      - backoffice
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunReconRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RunReconRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RunReconRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunReconResult'
          description: ''
  /api/backoffice/transactions:
    get:
      operationId: backoffice_transactions_list
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: AAAA-MM-DD
      - in: query
        name: date_to
        schema:
          type: string
      - in: query
        name: institution
        schema:
          type: string
      - in: query
        name: method
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: referência
      - in: query
        name: service
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      tags:
      - backoffice
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffTransactionList'
          description: ''
  /api/catalog/categories:
    get:
      operationId: catalog_categories_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/catalog/services:
    get:
      operationId: catalog_services_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: slug da categoria
      - in: query
        name: institution
        schema:
          type: string
        description: slug da instituição
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: pesquisa livre
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServicePublicList'
          description: ''
  /api/catalog/services/{id}:
    get:
      operationId: catalog_services_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePublic'
          description: ''
  /api/catalog/services/{id}/price:
    post:
      operationId: catalog_services_price_create
      description: 'Decomposição do valor (comissão, total) antes de pagar: serviços
        de valor fixo ou aberto.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PriceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PriceRequestRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
          description: ''
  /api/catalog/services/{id}/quote:
    post:
      operationId: catalog_services_quote_create
      description: 'Nível 1/2 com valor por consulta: pergunta à instituição quanto
        se deve.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
          description: ''
  /api/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/me/obligations:
    get:
      operationId: me_obligations_list
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Obligation'
          description: ''
    post:
      operationId: me_obligations_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
          description: ''
  /api/me/obligations/{id}:
    get:
      operationId: me_obligations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved obligation.
        required: true
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
          description: ''
    put:
      operationId: me_obligations_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved obligation.
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
          description: ''
    patch:
      operationId: me_obligations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved obligation.
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedObligationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedObligationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedObligationRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
          description: ''
    delete:
      operationId: me_obligations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved obligation.
        required: true
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/me/payments:
    get:
      operationId: me_payments_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
  /api/me/requests:
    get:
      operationId: me_requests_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequestPublicList'
          description: ''
  /api/payments:
    post:
      operationId: payments_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{reference}:
    get:
      operationId: payments_retrieve
      description: A referência (~50 bits aleatórios) funciona como capacidade de
        leitura do estado.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{reference}/3ds:
    post:
      operationId: payments_3ds_create
      description: Confirma o código 3-D Secure. Três tentativas erradas recusam o
        pagamento, como num emissor real.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDSRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ThreeDSRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ThreeDSRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{reference}/qr.svg:
    get:
      operationId: payments_qr.svg_retrieve
      description: 'QR do pagamento (SVG): ao ler, abre a página de pagamento com
        o valor e a referência.'
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
          description: ''
  /api/payments/{reference}/receipt.pdf:
    get:
      operationId: payments_receipt.pdf_retrieve
      description: PDF pela referência do pagamento (a referência é a capacidade de
        acesso, como no estado).
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/payments/{reference}/simular:
    post:
      operationId: payments_simular_create
      description: 'Só em DEMO_MODE: simula o cidadão a pagar a referência no banco
        ou a ler o QR na app.'
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/scenarios:
    get:
      operationId: payments_scenarios_retrieve
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenarios'
          description: ''
  /api/portal/{institution_slug}/balances:
    get:
      operationId: portal_balances_retrieve
      description: 'O dinheiro da instituição: a liquidar (confirmado, ainda no parceiro)
        e já liquidado na conta.'
