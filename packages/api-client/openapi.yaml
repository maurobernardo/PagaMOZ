openapi: 3.0.3
info:
  title: PagaMOZ API
  version: 0.1.0
  description: Plataforma de pagamentos de serviços — protótipo de demonstração.
paths:
  /api/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSent'
          description: ''
  /api/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/catalog/categories:
    get:
      operationId: catalog_categories_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/catalog/services:
    get:
      operationId: catalog_services_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: slug da categoria
      - in: query
        name: institution
        schema:
          type: string
        description: slug da instituição
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: pesquisa livre
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServicePublicList'
          description: ''
  /api/catalog/services/{id}:
    get:
      operationId: catalog_services_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePublic'
          description: ''
  /api/catalog/services/{id}/price:
    post:
      operationId: catalog_services_price_create
      description: Decomposição do valor (comissão, total) antes de pagar — serviços
        de valor fixo ou aberto.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PriceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PriceRequestRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
          description: ''
  /api/catalog/services/{id}/quote:
    post:
      operationId: catalog_services_quote_create
      description: 'Nível 1/2 com valor por consulta: pergunta à instituição quanto
        se deve.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
          description: ''
  /api/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/me/obligations:
    get:
      operationId: me_obligations_list
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Obligation'
          description: ''
    post:
      operationId: me_obligations_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
          description: ''
  /api/me/obligations/{id}:
    get:
      operationId: me_obligations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved obligation.
        required: true
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
          description: ''
    put:
      operationId: me_obligations_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved obligation.
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ObligationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
          description: ''
    patch:
      operationId: me_obligations_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved obligation.
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedObligationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedObligationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedObligationRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Obligation'
          description: ''
    delete:
      operationId: me_obligations_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved obligation.
        required: true
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/me/payments:
    get:
      operationId: me_payments_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
  /api/me/requests:
    get:
      operationId: me_requests_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequestPublicList'
          description: ''
  /api/payments:
    post:
      operationId: payments_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{reference}:
    get:
      operationId: payments_retrieve
      description: A referência (~50 bits aleatórios) funciona como capacidade de
        leitura do estado.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/scenarios:
    get:
      operationId: payments_scenarios_retrieve
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenarios'
          description: ''
  /api/portal/{institution_slug}/balances:
    get:
      operationId: portal_balances_retrieve
      description: 'O dinheiro da instituição: a liquidar (confirmado, ainda no parceiro)
        e já liquidado na conta.'
      parameters:
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balances'
          description: ''
  /api/portal/{institution_slug}/requests:
    get:
      operationId: portal_requests_list
      parameters:
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequestPublicList'
          description: ''
  /api/portal/{institution_slug}/requests/{code}:
    get:
      operationId: portal_requests_retrieve
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPortal'
          description: ''
  /api/portal/{institution_slug}/requests/{code}/attachments/{att_id}:
    get:
      operationId: portal_requests_attachments_retrieve
      parameters:
      - in: path
        name: att_id
        schema:
          type: integer
        required: true
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/portal/{institution_slug}/requests/{code}/status:
    post:
      operationId: portal_requests_status_create
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPortal'
          description: ''
  /api/portal/{institution_slug}/services:
    get:
      operationId: portal_services_list
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServicePortalList'
          description: ''
    post:
      operationId: portal_services_create
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePortalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServicePortalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServicePortalRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePortal'
          description: ''
  /api/portal/{institution_slug}/services/{id}:
    get:
      operationId: portal_services_retrieve
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service.
        required: true
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePortal'
          description: ''
    put:
      operationId: portal_services_update
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service.
        required: true
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePortalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServicePortalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServicePortalRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePortal'
          description: ''
    patch:
      operationId: portal_services_partial_update
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service.
        required: true
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
