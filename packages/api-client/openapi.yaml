openapi: 3.0.3
info:
  title: PagaMOZ API
  version: 0.1.0
  description: Plataforma de pagamentos de serviços — protótipo de demonstração.
paths:
  /api/catalog/categories:
    get:
      operationId: catalog_categories_list
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/catalog/services:
    get:
      operationId: catalog_services_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServicePublicList'
          description: ''
  /api/catalog/services/{id}:
    get:
      operationId: catalog_services_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service.
        required: true
      tags:
      - catalog
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePublic'
          description: ''
  /api/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/payments:
    post:
      operationId: payments_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/{reference}:
    get:
      operationId: payments_retrieve
      description: A referência (~50 bits aleatórios) funciona como capacidade de
        leitura do estado.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/payments/scenarios:
    get:
      operationId: payments_scenarios_retrieve
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenarios'
          description: ''
  /api/portal/{institution_slug}/balances:
    get:
      operationId: portal_balances_retrieve
      description: 'O dinheiro da instituição: a liquidar (confirmado, ainda no parceiro)
        e já liquidado na conta.'
      parameters:
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balances'
          description: ''
  /api/portal/{institution_slug}/services:
    get:
      operationId: portal_services_list
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServicePortalList'
          description: ''
    post:
      operationId: portal_services_create
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePortal'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServicePortal'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServicePortal'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePortal'
          description: ''
  /api/portal/{institution_slug}/services/{id}:
    get:
      operationId: portal_services_retrieve
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service.
        required: true
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePortal'
          description: ''
    put:
      operationId: portal_services_update
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service.
        required: true
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePortal'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServicePortal'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServicePortal'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePortal'
          description: ''
    patch:
      operationId: portal_services_partial_update
      description: Serviços da instituição do URL. Nunca devolve serviços de outra
        instituição.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service.
        required: true
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      tags:
      - portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServicePortal'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedServicePortal'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedServicePortal'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePortal'
          description: ''
  /api/portal/{institution_slug}/settlements:
    get:
      operationId: portal_settlements_list
      parameters:
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSettlementList'
          description: ''
  /api/webhooks/{method}:
    post:
      operationId: webhooks_create
      parameters:
      - in: path
        name: method
        schema:
          type: string
        required: true
      tags:
      - webhooks
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
          description: ''
components:
  schemas:
    Balances:
      type: object
      properties:
        a_liquidar:
          type: integer
        liquidado:
          type: integer
        conta_destino:
          type: string
      required:
      - a_liquidar
      - conta_destino
      - liquidado
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 200
        icon:
          type: string
          maxLength: 40
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        service_count:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - service_count
      - slug
    CommissionPayerEnum:
      enum:
      - cidadao
      - instituicao
      type: string
      description: |-
        * `cidadao` - Cidadão
        * `instituicao` - Instituição
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        queue:
          type: string
        demo_mode:
          type: boolean
      required:
      - database
      - demo_mode
      - queue
      - status
    InstitutionPublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nome
          maxLength: 160
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        is_demo:
          type: boolean
      required:
      - id
      - name
      - slug
    IntegrationLevelEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - Consulta + pagamento em tempo real
        * `2` - Referência de pagamento
        * `3` - Pedido assistido
    Me:
      type: object
      properties:
        phone:
          type: string
        name:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      required:
      - memberships
      - name
      - phone
    Membership:
      type: object
      properties:
        institution:
          allOf:
          - $ref: '#/components/schemas/InstitutionPublic'
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - institution
      - role
    MethodEnum:
      enum:
      - mpesa
      - emola
      - mkesh
      - cartao
      - referencia_bancaria
      - qr
      type: string
      description: |-
        * `mpesa` - M-Pesa
        * `emola` - e-Mola
        * `mkesh` - mKesh
        * `cartao` - Cartão Visa/Mastercard
        * `referencia_bancaria` - Referência bancária
        * `qr` - QR Code
    PaginatedServicePortalList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ServicePortal'
    PaginatedServicePublicList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ServicePublic'
    PaginatedSettlementList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
    PatchedServicePortal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        category:
          type: string
        integration_level:
          allOf:
          - $ref: '#/components/schemas/IntegrationLevelEnum'
          minimum: 0
          maximum: 9223372036854775807
        pricing:
          $ref: '#/components/schemas/PricingEnum'
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Valor fixo (centavos)
        min_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Mínimo (centavos)
        max_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Máximo (centavos)
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ServiceField'
        is_active:
          type: boolean
        commission_bps:
          type: integer
          maximum: 10000
          minimum: 0
          nullable: true
          title: Comissão (pontos base)
        commission_fixed:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Comissão fixa (centavos)
        commission_payer:
          oneOf:
          - $ref: '#/components/schemas/CommissionPayerEnum'
          - $ref: '#/components/schemas/BlankEnum'
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Payment:
      type: object
      properties:
        reference:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        service:
          type: integer
        service_name:
          type: string
        institution_name:
          type: string
        description:
          type: string
          maxLength: 200
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        commission:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        commission_payer:
          type: string
          maxLength: 12
        total:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        institution_net:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        currency:
          type: string
          maxLength: 3
        method:
          $ref: '#/components/schemas/MethodEnum'
        instructions:
          type: string
          readOnly: true
        failure_reason:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        settled_at:
          type: string
          format: date-time
          nullable: true
      required:
      - amount
      - commission
      - commission_payer
      - created_at
      - institution_name
      - institution_net
      - instructions
      - method
      - reference
      - service
      - service_name
      - total
    PaymentCreate:
      type: object
      properties:
        service:
          type: integer
        fields:
          type: object
          additionalProperties:
            type: string
        amount:
          type: integer
          minimum: 1
          description: Centavos (serviços de valor aberto).
        method:
          $ref: '#/components/schemas/MethodEnum'
        payer_phone:
          oneOf:
          - type: string
            pattern: ^\+258[28]\d{8}$
          - type: string
            maxLength: 0
        scenario:
          allOf:
          - $ref: '#/components/schemas/ScenarioEnum'
          description: |-
            Só em ambiente de demonstração.

            * `sucesso` - sucesso
            * `falha` - falha
            * `atraso` - atraso
            * `timeout` - timeout
            * `duplicado` - duplicado
            * `webhook_repetido` - webhook_repetido
      required:
      - method
      - service
    PricingEnum:
      enum:
      - fixo
      - consulta
      - aberto
      type: string
      description: |-
        * `fixo` - Valor fixo
        * `consulta` - Valor obtido por consulta
        * `aberto` - Valor introduzido pelo cidadão
    RoleEnum:
      enum:
      - admin
      - financeiro
      - operador
      type: string
      description: |-
        * `admin` - Administrador
        * `financeiro` - Financeiro
        * `operador` - Operador
    ScenarioEnum:
      enum:
      - sucesso
      - falha
      - atraso
      - timeout
      - duplicado
      - webhook_repetido
      type: string
      description: |-
        * `sucesso` - sucesso
        * `falha` - falha
        * `atraso` - atraso
        * `timeout` - timeout
        * `duplicado` - duplicado
        * `webhook_repetido` - webhook_repetido
    Scenarios:
      type: object
      properties:
        demo_mode:
          type: boolean
        scenarios:
          type: object
          additionalProperties: {}
      required:
      - demo_mode
      - scenarios
    ServiceField:
      type: object
      properties:
        name:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          maxLength: 80
        type:
          $ref: '#/components/schemas/TypeEnum'
        required:
          type: boolean
          default: true
        pattern:
          type: string
      required:
      - label
      - name
      - type
    ServicePortal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        category:
          type: string
        integration_level:
          allOf:
          - $ref: '#/components/schemas/IntegrationLevelEnum'
          minimum: 0
          maximum: 9223372036854775807
        pricing:
          $ref: '#/components/schemas/PricingEnum'
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Valor fixo (centavos)
        min_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Mínimo (centavos)
        max_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Máximo (centavos)
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ServiceField'
        is_active:
          type: boolean
        commission_bps:
          type: integer
          maximum: 10000
          minimum: 0
          nullable: true
          title: Comissão (pontos base)
        commission_fixed:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Comissão fixa (centavos)
        commission_payer:
          oneOf:
          - $ref: '#/components/schemas/CommissionPayerEnum'
          - $ref: '#/components/schemas/BlankEnum'
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - id
      - integration_level
      - name
      - pricing
      - slug
      - updated_at
    ServicePublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        institution:
          allOf:
          - $ref: '#/components/schemas/InstitutionPublic'
          readOnly: true
        category:
          type: string
          readOnly: true
        integration_level:
          allOf:
          - $ref: '#/components/schemas/IntegrationLevelEnum'
          minimum: 0
          maximum: 9223372036854775807
        pricing:
          $ref: '#/components/schemas/PricingEnum'
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Valor fixo (centavos)
        min_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Mínimo (centavos)
        max_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Máximo (centavos)
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ServiceField'
          readOnly: true
      required:
      - category
      - fields
      - id
      - institution
      - integration_level
      - name
      - pricing
      - slug
    Settlement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        business_date:
          type: string
          format: date
        count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        gross:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        commission:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        net:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        destination:
          type: string
          maxLength: 120
        provider:
          type: string
          maxLength: 40
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business_date
      - commission
      - count
      - created_at
      - destination
      - gross
      - id
      - net
    StatusEnum:
      enum:
      - CRIADA
      - PENDENTE
      - CONFIRMADA
      - LIQUIDADA
      - FALHADA
      - EXPIRADA
      - REVERTIDA
      - EM_DISPUTA
      type: string
      description: |-
        * `CRIADA` - Created
        * `PENDENTE` - Pending
