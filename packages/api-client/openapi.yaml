components:
  schemas:
    ActionEnum:
      enum:
      - retry
      - resolve
      type: string
      description: |-
        * `retry` - retry
        * `resolve` - resolve
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        field:
          type: string
          readOnly: true
        original_name:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - field
      - id
      - original_name
      - sha256
      - size
    Audit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          readOnly: true
        actor_phone:
          type: string
          nullable: true
        institution_name:
          type: string
          nullable: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        data:
          readOnly: true
        ip:
          type: string
          readOnly: true
          nullable: true
      required:
      - action
      - created_at
      - data
      - id
      - ip
      - target_id
      - target_type
    Balances:
      type: object
      properties:
        a_liquidar:
          type: integer
        liquidado:
          type: integer
        conta_destino:
          type: string
      required:
      - a_liquidar
      - conta_destino
      - liquidado
    BlankEnum:
      enum:
      - ''
    BrandEnum:
      enum:
      - visa
      - mastercard
      type: string
      description: |-
        * `visa` - visa
        * `mastercard` - mastercard
    CardSummaryRequest:
      type: object
      description: 'O que o browser envia depois de tokenizar: nunca o número completo
        nem o CVV.'
      properties:
        token:
          type: string
          minLength: 1
          pattern: ^tok_[A-Za-z0-9]{16,40}$
        brand:
          $ref: '#/components/schemas/BrandEnum'
        last4:
          type: string
          minLength: 1
          pattern: ^\d{4}$
        exp_month:
          type: integer
          maximum: 12
          minimum: 1
        exp_year:
          type: integer
          maximum: 2100
          minimum: 2000
        holder:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - brand
      - exp_month
      - exp_year
      - holder
      - last4
      - token
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
        order:
          type: integer
          readOnly: true
        service_count:
          type: integer
          readOnly: true
      required:
      - description
      - icon
      - id
      - name
      - order
      - service_count
      - slug
    CommissionPayerEnum:
      enum:
      - cidadao
      - instituicao
      type: string
      description: |-
        * `cidadao` - Cidadão
        * `instituicao` - Instituição
    Csrf:
      type: object
      properties:
        csrf:
          type: string
      required:
      - csrf
    DLActionRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
    Dashboard:
      type: object
      properties:
        today:
          type: object
          additionalProperties: {}
        week:
          type: object
          additionalProperties: {}
        month:
          type: object
          additionalProperties: {}
        by_service:
          type: array
          items:
            type: object
            additionalProperties: {}
        by_method:
          type: array
          items:
            type: object
            additionalProperties: {}
        daily:
          type: array
          items:
            type: object
            additionalProperties: {}
        balances:
          type: object
          additionalProperties: {}
        pending_requests:
          type: integer
        open_discrepancies:
          type: integer
      required:
      - balances
      - by_method
      - by_service
      - daily
      - month
      - open_discrepancies
      - pending_requests
      - today
      - week
    DeadLetter:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        kind:
          type: string
          readOnly: true
        payload:
          readOnly: true
        error:
          type: string
          readOnly: true
        resolved:
          type: boolean
          readOnly: true
      required:
      - created_at
      - error
      - id
      - kind
      - payload
      - resolved
    Delivery:
      type: object
      properties:
        titulo:
          type: string
        codigo:
          type: string
        instrucao:
          type: string
    Discrepancy:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        kind_label:
          type: string
        reference:
          type: string
          readOnly: true
        provider_ref:
          type: string
          readOnly: true
        platform_amount:
          type: integer
          readOnly: true
          nullable: true
        provider_amount:
          type: integer
          readOnly: true
          nullable: true
        detail:
          type: string
          readOnly: true
        resolved:
          type: boolean
          readOnly: true
        resolution_note:
          type: string
          readOnly: true
      required:
      - detail
      - id
      - kind
      - kind_label
      - platform_amount
      - provider_amount
      - provider_ref
      - reference
      - resolution_note
      - resolved
    DiscrepancyStaff:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        business_date:
          type: string
          format: date
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        kind_label:
          type: string
        institution_name:
          type: string
          nullable: true
        reference:
          type: string
          readOnly: true
        provider_ref:
          type: string
          readOnly: true
        platform_amount:
          type: integer
          readOnly: true
          nullable: true
        provider_amount:
          type: integer
          readOnly: true
          nullable: true
        detail:
          type: string
          readOnly: true
        resolved:
          type: boolean
          readOnly: true
        resolution_note:
          type: string
          readOnly: true
      required:
      - business_date
      - detail
      - id
      - institution_name
      - kind
      - kind_label
      - platform_amount
      - provider_amount
      - provider_ref
      - reference
      - resolution_note
      - resolved
    Event:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/RequestStatusEnum'
          readOnly: true
        note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - note
      - status
    Health:
      type: object
      properties:
        status:
