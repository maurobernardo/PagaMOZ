  /api/portal/{institution_slug}/settlements:
    get:
      operationId: portal_settlements_list
      parameters:
      - in: path
        name: institution_slug
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - portal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSettlementList'
          description: ''
  /api/requests:
    post:
      operationId: requests_create
      description: 'multipart: `service`, `fields` (JSON), e um ficheiro por cada
        campo do tipo file.'
      tags:
      - requests
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPublic'
          description: ''
  /api/requests/{code}:
    get:
      operationId: requests_retrieve
      description: O código (~50 bits aleatórios) dá acesso ao estado; formulário
        e anexos não são expostos.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - requests
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPublic'
          description: ''
  /api/webhooks/{method}:
    post:
      operationId: webhooks_create
      parameters:
      - in: path
        name: method
        schema:
          type: string
        required: true
      tags:
      - webhooks
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
          description: ''
components:
  schemas:
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        field:
          type: string
          readOnly: true
        original_name:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - field
      - id
      - original_name
      - sha256
      - size
    Balances:
      type: object
      properties:
        a_liquidar:
          type: integer
        liquidado:
          type: integer
        conta_destino:
          type: string
      required:
      - a_liquidar
      - conta_destino
      - liquidado
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
        order:
          type: integer
          readOnly: true
        service_count:
          type: integer
          readOnly: true
      required:
      - description
      - icon
      - id
      - name
      - order
      - service_count
      - slug
    CommissionPayerEnum:
      enum:
      - cidadao
      - instituicao
      type: string
      description: |-
        * `cidadao` - Cidadão
        * `instituicao` - Instituição
    Event:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/RequestStatusEnum'
          readOnly: true
        note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - note
      - status
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        queue:
          type: string
        demo_mode:
          type: boolean
      required:
      - database
      - demo_mode
      - queue
      - status
    InstitutionPublic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: Nome
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        is_demo:
          type: boolean
          readOnly: true
      required:
      - id
      - is_demo
      - name
      - slug
    IntegrationLevelEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - Consulta + pagamento em tempo real
        * `2` - Referência de pagamento
        * `3` - Pedido assistido
    Me:
      type: object
      properties:
        phone:
          type: string
        name:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      required:
      - memberships
      - name
      - phone
    Membership:
      type: object
      properties:
        institution:
          allOf:
          - $ref: '#/components/schemas/InstitutionPublic'
          readOnly: true
        role:
